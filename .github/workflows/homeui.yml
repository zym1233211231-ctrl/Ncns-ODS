name: homeui

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-homeui:
    name: Compile Compose home module
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          set -eux
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"; ls "$SDK" || true
          JAR=""
          for api in 35 34 33; do
            if [ -f "$SDK/platforms/android-$api/android.jar" ]; then JAR="$SDK/platforms/android-$api/android.jar"; break; fi
          done
          if [ -z "$JAR" ]; then
            SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-34" >/dev/null
            JAR="$SDK/platforms/android-34/android.jar"
          fi
          test -f "$JAR"
          echo "ANDROID_JAR=$JAR" >> "$GITHUB_ENV"

      - name: Cache Kotlin/Compose toolchain
        uses: actions/cache@v4
        with:
          path: homeui/.toolchain
          key: homeui-tc-${{ runner.os }}-${{ hashFiles('homeui/toolchain/setup.sh') }}

      - name: Fetch toolchain
        run: ./homeui/toolchain/setup.sh

      - name: Compile classes3.dex
        run: ./homeui/build-home.sh

      - name: Verify composable entry contract
        run: |
          set -eux
          ls -l build/dex/classes3.dex
          test "$(stat -c%s build/dex/classes3.dex)" -gt 100000
          test "$(find build/homeui/classes -name '*.class' | wc -l)" -ge 25
          javap -p -cp build/homeui/classes com.hextech.aram.LauncherScreenKt \
            | grep -F "LauncherScreen(java.lang.String, kotlin.jvm.functions.Function0<kotlin.Unit>, kotlin.jvm.functions.Function0<kotlin.Unit>, kotlin.jvm.functions.Function0<kotlin.Unit>, androidx.compose.runtime.Composer, int)"

      - uses: actions/upload-artifact@v4
        with:
          name: classes3-dex
          path: build/dex/classes3.dex
          if-no-files-found: error
